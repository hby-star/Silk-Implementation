schema_version = 1
experiment_id = "beacon-performance"
description = "Silk, Rondo, and Spurt normal-path scaling on one remote Docker host with eight-region AWS-like RTT shaping"
seed_base = 1

[execution]
driver = "distributed"
executors = ["docker"]
build_profile = "release"

[smoke]
sample_role = "smoke"
n = 4
t = 1
batch_size = 2
epochs = 1
completion_policy = "all-participants-durable"

[matrix]
status = "ready"
implementations = ["silk-beacon", "rondo-beacon", "spurt-beacon"]
executors = ["docker"]
warmup_runs = 0
measured_runs = 1
outputs_per_run = 200
dimensions = [
  "implementation",
  "n",
  "t",
  "batch_size",
  "epochs",
  "executor",
  "network_scenario",
  "region_assignment",
  "resource_profile",
  "seed",
  "completion_policy",
]

[[matrix.cells]]
n = 4
t = 1
batch_size = 50

[[matrix.cells]]
n = 7
t = 2
batch_size = 50

[[matrix.cells]]
n = 16
t = 5
batch_size = 50

[[matrix.cells]]
n = 31
t = 10
batch_size = 50

[[matrix.cells]]
n = 64
t = 21
batch_size = 50

[matrix.network]
profile = "docker-wan-8-region-v1"
bandwidth_mbps = 10000
delay_distribution = "fixed-pairwise"
delay_min_ms = 2
delay_max_ms = 350
loss_percent = 0.0
reorder_percent = 0.0
duplicate_percent = 0.0
seed_policy = "static-rtt-matrix-v1"
region_assignment = "round-robin-v1"
regions = [
  "us-east-1",
  "us-west-2",
  "eu-west-1",
  "eu-central-1",
  "ap-northeast-1",
  "ap-southeast-1",
  "ap-southeast-2",
  "sa-east-1",
]
# Representative symmetric RTTs in milliseconds. The container applies half of
# each value as egress delay; same-region traffic uses a 2 ms RTT baseline.
rtt_matrix_ms = [
  [2, 68, 70, 88, 162, 230, 198, 120],
  [68, 2, 140, 153, 100, 168, 138, 184],
  [70, 140, 2, 24, 226, 170, 272, 190],
  [88, 153, 24, 2, 238, 160, 260, 200],
  [162, 100, 226, 238, 2, 75, 105, 270],
  [230, 168, 170, 160, 75, 2, 92, 330],
  [198, 138, 272, 260, 105, 92, 2, 350],
  [120, 184, 190, 200, 270, 330, 350, 2],
]

[matrix.resources]
profile = "docker-per-node-v1"
cpu_cores_per_node = 1.0
memory_mib_per_node = 2048
one_container_per_node = true

[matrix.isolation]
policy = "strict-between-runs-v1"
cleanup_before_run = true
cleanup_after_run = true
verify_terminated = true
scope = "experiment-labelled-containers-and-networks"

[metrics]
primary = [
  "throughput_outputs_per_second",
  "wire_bytes_per_output",
  "wire_kib_per_output",
  "wire_mib_per_output",
  "commitment_wall_ns",
  "agreement_wall_ns",
  "reconstruction_wall_ns",
]
separate_phases = ["quorum_release", "framework_overhead"]
per_node_log = true
node_log_format = "jsonl"
node_result_format = "csv"
