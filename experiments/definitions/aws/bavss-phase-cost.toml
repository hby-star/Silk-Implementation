schema_version = 1
experiment_id = "bavss-phase-cost"
description = "Per-phase matched bAVSS normal-path wall time, CPU time, and sender-side framed wire bytes"
seed_base = 1

[execution]
driver = "local-process"
executors = ["aws-aggregate"]
build_profile = "release"

[smoke]
sample_role = "smoke"
n = 4
t = 1
batch_size = 2
samples = 1

[matrix]
status = "ready"
implementations = ["silk-bavss-po", "rondo-bavss-po"]
executors = ["aws-aggregate"]
warmup_runs = 0
measured_runs = 3
samples_per_run = 1
response_repetitions = [1]
dimensions = [
  "implementation",
  "n",
  "t",
  "batch_size",
  "response_repetitions",
  "executor",
  "resource_profile",
  "seed",
]

[[matrix.cells]]
n = 7
t = 2
batch_size = 14

[[matrix.cells]]
n = 16
t = 5
batch_size = 32

[[matrix.cells]]
n = 31
t = 10
batch_size = 62

[[matrix.cells]]
n = 61
t = 20
batch_size = 122

[[matrix.cells]]
n = 91
t = 30
batch_size = 182

[[matrix.cells]]
n = 121
t = 40
batch_size = 242

[matrix.resources]
profile = "aws-t3a-medium-aggregate-v1"
cpu_cores_per_node = 2.0
memory_mib_per_node = 4096
# Matrix A measures one aggregate normal-path workload, not n distributed replicas.
one_container_per_node = false

[matrix.isolation]
policy = "strict-between-runs-v1"
cleanup_before_run = true
cleanup_after_run = true
verify_terminated = true
scope = "one-native-aggregate-process-per-run"

[metrics]
phases = ["share", "verify", "reconstruct"]
primary = ["wall_ns", "process_cpu_ns", "protocol_wire_bytes_sent"]
raw = ["payload_bytes", "messages", "rss_bytes", "storage_bytes"]
