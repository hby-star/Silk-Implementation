[workspace]
members = [
    "crates/crypto-primitives",
    "crates/crypto-primitives/mldsa-native65",
    "crates/support/protocol",
    "crates/support/runner",
    "crates/beacon-node",
    "crates/support/records",
    "crates/rondo-bavss-po",
    "crates/rondo-beacon",
    "crates/silk-bavss-po",
    "crates/silk-beacon",
    "crates/spurt-beacon",
]
resolver = "2"

[workspace.dependencies]
blake3 = "1.5"
blst = "0.3"
blstrs = "0.7.1"
clap = { version = "4.5", features = ["derive"] }
cpu-time = "1.0"
csv = "1.3"
curve25519-dalek = { version = "4.1", features = ["rand_core", "serde"] }
ed25519-dalek = "2.2"
ff = "0.13"
group = "0.13"
hex = "0.4"
hmac = "0.12"
hostname = "0.4"
ml-dsa = "0.1.1"
postcard = { version = "1.1", features = ["alloc"] }
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.37"
thiserror = "2.0"
toml = "0.9"
